name: Publish PrimeRL FA2 wheel

on:
  push:
    tags:
      - "prime-fa2-v*"

permissions:
  contents: write

jobs:
  setup-release:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.release.outputs.release-tag }}
    steps:
      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
          echo "release-tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  build-wheel:
    needs: setup-release
    uses: ./.github/workflows/_build.yml
    with:
      runs-on: ubuntu-22.04
      python-version: "3.12"
      cuda-version: "13.0.1"
      torch-version: "2.11.0"
      cxx11_abi: "TRUE"
      release-version: ${{ needs.setup-release.outputs.release-tag }}
      upload-to-release: true
    secrets: inherit
